[pytest]
pythonpath = .
testpaths = tests
markers =
    api: API-level tests (no browser)
    smoke: minimal set proving the endpoint is alive
    negative: expects a non-2xx response
    known_issue: asserts correct behaviour that the API does not yet implement
    enrollment: learner registration -> SCP program enrollment flow
    db: verifies API results directly against the QA database (skips if DB not configured)
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
