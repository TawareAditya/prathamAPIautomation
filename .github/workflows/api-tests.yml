name: API Automation Tests

on:
  push:                       # run on every push to any branch
  pull_request:
    branches: [main]
  workflow_dispatch:          # allow manual runs from the Actions tab
    inputs:
      base_url:
        description: "API base URL to test against"
        required: false
        default: "https://qa-interface.prathamdigital.org/interface/v1"
      response_budget:
        description: "Per-request timeout budget in SECONDS for timing assertions"
        required: false
        default: "10"
      pytest_args:
        description: "Extra pytest args, e.g. -m smoke  or  -m 'not known_issue'"
        required: false
        default: ""
  schedule:
    # ~10:07 AM IST, Mon-Fri (04:37 UTC; IST is UTC+5:30).
    # Deliberately OFF the round :00/:30 marks: GitHub delays or drops
    # scheduled runs under load, and the top and half of each hour are the
    # busiest, most-dropped slots. An odd minute is far less contended.
    # GitHub still does not guarantee exact timing — expect a few minutes' drift.
    - cron: "37 4 * * 1-5"

# A newer push to the same branch cancels an in-flight run. Scheduled runs are
# kept distinct so a nightly result is never discarded by a push.
concurrency:
  group: api-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Run pytest API suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # inputs.* is empty on push/schedule, so every value needs a fallback.
      API_BASE_URL: ${{ inputs.base_url || 'https://qa-interface.prathamdigital.org/interface/v1' }}
      API_RESPONSE_BUDGET: ${{ inputs.response_budget || '10' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API test suite
        id: tests
        # DB verification tests read these. When the secrets are absent they
        # resolve to empty strings and the DB tests skip cleanly — the rest of
        # the suite runs regardless. Add the secrets to turn DB checks on.
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          mkdir -p reports
          pytest tests/api \
            -v \
            --html=reports/api-report.html --self-contained-html \
            --junitxml=reports/junit.xml \
            ${{ inputs.pytest_args }}

      # Writes reports/email-summary.html and appends a digest to the
      # Actions run page (via $GITHUB_STEP_SUMMARY).
      - name: Build run summary
        if: always()
        run: python -m utility.api.ci_summary reports/junit.xml reports/email-summary.html

      - name: Upload HTML reports
        if: always()          # keep reports even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports-${{ github.run_number }}
          path: reports/*.html
          retention-days: 30

      - name: Load email summary HTML
        if: always()
        id: summary
        shell: bash
        run: |
          # Random delimiter, per GitHub's guidance for multiline outputs.
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "html<<$DELIM"
            if [ -s reports/email-summary.html ]; then
              cat reports/email-summary.html
            else
              echo "<p>Summary report was not generated. See the run logs and attached reports.</p>"
            fi
            # Guarantees the delimiter starts on its own line even if the file
            # has no trailing newline. A stray blank line is harmless in HTML.
            echo ""
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # An unset secret renders as an empty string, which surfaces further down
      # as a cryptic "At least one of 'to', 'cc' or 'bcc' must be specified".
      # Name the actual problem instead.
      - name: Check mail configuration
        if: >
          always() &&
          (github.event_name == 'schedule' ||
           github.ref == 'refs/heads/main' ||
           github.event_name == 'workflow_dispatch')
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          missing=""
          for name in MAIL_SERVER MAIL_PORT MAIL_USERNAME MAIL_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under" \
                 "Settings > Secrets and variables > Actions. Names are case-sensitive."
            exit 1
          fi
          echo "All four mail secrets are present."

      - name: Send email notification
        # Only notify on scheduled runs and on main — otherwise every push to
        # a feature branch spams the list. Remove the ref check to widen it.
        if: >
          always() &&
          (github.event_name == 'schedule' ||
           github.ref == 'refs/heads/main' ||
           github.event_name == 'workflow_dispatch')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Pratham - API Automation Tests Report (QA)"
          # Recipients depend on what triggered the run:
          #   scheduled run                     -> the full distribution list
          #   push with '[notify-all]' in the   -> the full distribution list
          #     commit message                     (deliberate full-team send)
          #   any other push / manual run       -> the maintainer only, so
          #                                        commit-by-commit runs do not
          #                                        spam the team
          # Comma-separated, no spaces — a space after a comma breaks the send.
          to: ${{ (github.event_name == 'schedule' || contains(github.event.head_commit.message, '[notify-all]')) && 'aditya_t@tekditechnologies.com,priyanka_s@tekditechnologies.com,shubham.jha@tekditechnologies.com,snehal.patil@tekditechnologies.com,amol.chitale@tekditechnologies.com,rushi_g@tekditechnologies.com' || 'aditya_t@tekditechnologies.com' }}
          from: API Automation <${{ secrets.MAIL_USERNAME }}>
          html_body: ${{ steps.summary.outputs.html }}
          body: |
            API Automation Tests finished with status: ${{ job.status }}

            Repository: ${{ github.repository }}
            Branch/ref: ${{ github.ref_name }}
            Triggered by: ${{ github.event_name }}
            Commit: ${{ github.sha }}
            Target API: ${{ env.API_BASE_URL }}

            View the full run and download the HTML reports here:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: reports/*.html
